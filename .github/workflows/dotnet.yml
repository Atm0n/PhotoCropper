name: .NET CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        include:
          - os: ubuntu-22.04
            runtime: linux-x64
            artifact: PhotoCropper-Linux
          - os: windows-latest
            runtime: win-x64
            artifact: PhotoCropper-Windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y libgomp1 libgl1 libtbb2 libglib2.0-0 libicu-dev libatlas-base-dev libjpeg-dev

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: List Test Assets (Linux Debug)
      if: runner.os == 'Linux'
      run: |
        ls -R PhotoCropper.Tests/bin/Release/net10.0/

    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Publish
      run: |
        dotnet publish PhotoCropperGui/PhotoCropperGui.csproj `
          -c Release `
          -r ${{ matrix.runtime }} `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishReadyToRun=true `
          -o ./publish/${{ matrix.runtime }}
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ./publish/${{ matrix.runtime }}
