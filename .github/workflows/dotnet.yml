name: .NET CI

on:
  push:
    branches: [ master, developer ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, developer ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            artifact: PhotoCropper-Linux
          - os: windows-latest
            runtime: win-x64
            artifact: PhotoCropper-Windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y \
          libgomp1 libgl1 libtbb12 libglib2.0-0 libicu-dev libatlas-base-dev libjpeg-dev libx11-6 \
          libgeotiff-dev libhdf5-dev libvtk9-dev \
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Fix Native Libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        cp PhotoCropper.Tests/bin/Release/net10.0/runtimes/ubuntu-x64/native/* PhotoCropper.Tests/bin/Release/net10.0/

    - name: List Test Assets (Linux Debug)
      if: runner.os == 'Linux'
      run: |
        ls -R PhotoCropper.Tests/bin/Release/net10.0/
        ldd PhotoCropper.Tests/bin/Release/net10.0/libcvextern.so

    - name: Test
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/PhotoCropper.Tests/bin/Release/net10.0/
        fi
        dotnet run --no-build -c Release --project PhotoCropper.Tests/PhotoCropper.Tests.csproj
      shell: bash

    - name: Publish GUI & CLI
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet publish PhotoCropperGui/PhotoCropperGui.csproj `
          -c Release `
          -r ${{ matrix.runtime }} `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishReadyToRun=true `
          -o ./publish/${{ matrix.runtime }}

        dotnet publish PhotoCropperCli/PhotoCropperCli.csproj `
          -c Release `
          -r ${{ matrix.runtime }} `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishReadyToRun=true `
          -o ./publish/${{ matrix.runtime }}

        Compress-Archive -Path ./publish/${{ matrix.runtime }}/* -DestinationPath ./${{ matrix.artifact }}.zip
      shell: pwsh

    - name: Upload Artifact
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          ./publish/${{ matrix.runtime }}
          ./${{ matrix.artifact }}.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Linux Artifacts
      uses: actions/download-artifact@v4
      with:
        name: PhotoCropper-Linux
        path: ./artifacts-linux

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      with:
        name: PhotoCropper-Windows
        path: ./artifacts-windows

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts-linux/PhotoCropper-Linux.zip
          ./artifacts-windows/PhotoCropper-Windows.zip
        generate_release_notes: true
