name: CI Pipeline

on:
  pull_request:
    branches: [ main, developer ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [ main, developer ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            platform: Linux
          - os: windows-latest
            runtime: win-x64
            platform: Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Native Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y \
            libgomp1 libgl1 libtbb12 libglib2.0-0 libicu-dev libatlas-base-dev libjpeg-dev libx11-6 \
            libgeotiff-dev libhdf5-dev libvtk9-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsane1 sane-utils

      - name: Restore Dependencies
        run: dotnet restore PhotoCropper.slnx

      - name: Build Solution
        run: dotnet build PhotoCropper.slnx -c Release --no-restore

      - name: Run Core Tests
        run: dotnet run --project tests/PhotoCropper.Core.Tests/PhotoCropper.Core.Tests.csproj -c Release --no-build -- -parallelMode none

      - name: Run CLI Tests
        run: dotnet run --project tests/PhotoCropper.Cli.Tests/PhotoCropper.Cli.Tests.csproj -c Release --no-build -- -parallelMode none

      - name: Run GUI Tests
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build -- -parallelMode none
          else
            dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build -- -parallelMode none
          fi
        shell: bash
