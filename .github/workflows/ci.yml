name: CI Pipeline

on:
  pull_request:
    branches: [ main, developer ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [ main, developer ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
  # The release workflow runs these same tests before it packages anything.
  workflow_call:

concurrency:
  # The "ci-" prefix matters when the release workflow calls this one: github.workflow is then the caller's name,
  # and sharing the caller's own group would make each cancel or wait for the other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            platform: Linux
          - os: windows-latest
            runtime: win-x64
            platform: Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Install Native Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --fix-missing
          # Runtime libraries only (no -dev packages, no recommends): Emgu CV's libcvextern.so links against
          # VTK 9.1, HDF5, GeoTIFF, GStreamer, FFmpeg, GTK 3 and LAPACK; Avalonia and Skia need X11, ICE/SM and
          # fontconfig; NAPS2 needs SANE.
          sudo apt-get install -y --no-install-recommends \
            libgomp1 libgl1 libtbb12 libglib2.0-0t64 libx11-6 libice6 libsm6 libfontconfig1 \
            libtiff6 libgeotiff5 libfreetype6 libopenjp2-7 liblapack3 libblas3 \
            libhdf5-103-1t64 libvtk9.1t64 \
            libavcodec60 libavformat60 libavutil58 libswscale7 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgtk-3-0t64 \
            libsane1 sane-utils

      - name: Restore Dependencies
        run: dotnet restore PhotoCropper.slnx

      - name: Build Solution
        run: dotnet build PhotoCropper.slnx -c Release --no-restore

      - name: Check Native Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # Names any library OpenCV needs that the install step missed, instead of a test failing to load it.
          lib=$(find . -path '*/bin/Release/*' -name libcvextern.so -print -quit)
          missing=$(ldd "$lib" | grep "not found" || true)
          if [ -n "$missing" ]; then echo "Missing for $lib:"; echo "$missing"; exit 1; fi

      - name: Run Core Tests
        run: dotnet run --project tests/PhotoCropper.Core.Tests/PhotoCropper.Core.Tests.csproj -c Release --no-build -- -parallelMode none

      - name: Run CLI Tests
        run: dotnet run --project tests/PhotoCropper.Cli.Tests/PhotoCropper.Cli.Tests.csproj -c Release --no-build -- -parallelMode none

      - name: Run GUI Tests
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build -- -parallelMode none
          else
            dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build -- -parallelMode none
          fi
        shell: bash
