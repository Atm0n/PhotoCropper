name: CI Pipeline

on:
  pull_request:
    branches: [ main, developer ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [ main, developer ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
  # The release workflow runs these same tests before it packages anything.
  workflow_call:

concurrency:
  # The "ci-" prefix matters when the release workflow calls this one: github.workflow is then the caller's name,
  # and sharing the caller's own group would make each cancel or wait for the other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            platform: Linux
          - os: windows-latest
            runtime: win-x64
            platform: Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # The runner's Ubuntu mirror can be very slow (105 MB once took 15 minutes), so the downloaded .deb files
      # are cached; they are fetched again only when .github/linux-packages.txt changes.
      - name: Cache Native Packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-ubuntu-24.04-${{ hashFiles('.github/linux-packages.txt') }}

      - name: Install Native Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          grep -v '^#' .github/linux-packages.txt | xargs sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-cache"
          # apt leaves its lock and root-owned files there; the cache step must be able to read them.
          sudo rm -f ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache

      - name: Restore Dependencies
        run: dotnet restore PhotoCropper.slnx

      - name: Build Solution
        run: dotnet build PhotoCropper.slnx -c Release --no-restore

      - name: Check Native Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # Names any library OpenCV needs that the install step missed, instead of a test failing to load it.
          lib=$(find . -path '*/bin/Release/*' -name libOpenCvSharpExtern.so -print -quit)
          missing=$(ldd "$lib" | grep "not found" || true)
          if [ -n "$missing" ]; then echo "Missing for $lib:"; echo "$missing"; exit 1; fi

      - name: Run Core Tests
        run: dotnet run --project tests/PhotoCropper.Core.Tests/PhotoCropper.Core.Tests.csproj -c Release --no-build -- -parallelMode none

      - name: Run CLI Tests
        run: dotnet run --project tests/PhotoCropper.Cli.Tests/PhotoCropper.Cli.Tests.csproj -c Release --no-build -- -parallelMode none

      - name: Run GUI Tests
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build -- -parallelMode none
          else
            dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build -- -parallelMode none
          fi
        shell: bash
