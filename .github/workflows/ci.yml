name: Build, Test & Release

on:
  push:
    branches: [ main, developer ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, developer ]

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PhotoCropper.slnx

      - name: Build Solution
        run: dotnet build PhotoCropper.slnx -c Release --no-restore

      - name: Run Core Tests
        run: dotnet run --project tests/PhotoCropper.Core.Tests/PhotoCropper.Core.Tests.csproj -c Release --no-build

      - name: Run CLI Tests
        run: dotnet run --project tests/PhotoCropper.Cli.Tests/PhotoCropper.Cli.Tests.csproj -c Release --no-build

      - name: Run GUI Tests
        run: dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build

  publish:
    name: Package Release Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            gui_zip: PhotoCropper-GUI-Windows.zip
            cli_zip: PhotoCropper-CLI-Windows.zip
          - os: ubuntu-latest
            rid: linux-x64
            gui_zip: PhotoCropper-GUI-Linux.zip
            cli_zip: PhotoCropper-CLI-Linux.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish GUI (${{ matrix.rid }})
        run: >
          dotnet publish src/PhotoCropper.Gui/PhotoCropper.Gui.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -o publish/gui

      - name: Publish CLI (${{ matrix.rid }})
        run: >
          dotnet publish src/PhotoCropper.Cli/PhotoCropper.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -o publish/cli

      - name: Archive GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/gui/* -DestinationPath ${{ matrix.gui_zip }}

      - name: Archive CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/cli/* -DestinationPath ${{ matrix.cli_zip }}

      - name: Archive GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish/gui && zip -r ../../${{ matrix.gui_zip }} . && cd ../..

      - name: Archive CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish/cli && zip -r ../../${{ matrix.cli_zip }} . && cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            ${{ matrix.gui_zip }}
            ${{ matrix.cli_zip }}

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhotoCropper-GUI-Windows.zip
            PhotoCropper-GUI-Linux.zip
            PhotoCropper-CLI-Windows.zip
            PhotoCropper-CLI-Linux.zip
          draft: false
          prerelease: false
          generate_release_notes: true
