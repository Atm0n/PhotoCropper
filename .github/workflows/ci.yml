name: CI & Release Pipeline

on:
  push:
    branches: [ master, main, developer ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main, developer ]

permissions:
  contents: write

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            platform: Linux
          - os: windows-latest
            runtime: win-x64
            platform: Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y \
            libgomp1 libgl1 libtbb12 libglib2.0-0 libicu-dev libatlas-base-dev libjpeg-dev libx11-6 \
            libgeotiff-dev libhdf5-dev libvtk9-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Restore Dependencies
        run: dotnet restore PhotoCropper.slnx

      - name: Build Solution
        run: dotnet build PhotoCropper.slnx -c Release --no-restore

      - name: Run Core Tests
        run: dotnet run --project tests/PhotoCropper.Core.Tests/PhotoCropper.Core.Tests.csproj -c Release --no-build

      - name: Run CLI Tests
        run: dotnet run --project tests/PhotoCropper.Cli.Tests/PhotoCropper.Cli.Tests.csproj -c Release --no-build

      - name: Run GUI Tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build
          else
            dotnet run --project tests/PhotoCropper.Gui.Tests/PhotoCropper.Gui.Tests.csproj -c Release --no-build
          fi
        shell: bash

      - name: Publish GUI & CLI Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Publish GUI
          dotnet publish src/PhotoCropper.Gui/PhotoCropper.Gui.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o ./publish/gui/${{ matrix.runtime }}

          # Publish CLI
          dotnet publish src/PhotoCropper.Cli/PhotoCropper.Cli.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o ./publish/cli/${{ matrix.runtime }}

          # Package separate zip archives
          Compress-Archive -Path ./publish/gui/${{ matrix.runtime }}/* -DestinationPath ./PhotoCropper-GUI-${{ matrix.platform }}.zip
          Compress-Archive -Path ./publish/cli/${{ matrix.runtime }}/* -DestinationPath ./PhotoCropper-CLI-${{ matrix.platform }}.zip

      - name: Upload GUI Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCropper-GUI-${{ matrix.platform }}
          path: ./PhotoCropper-GUI-${{ matrix.platform }}.zip

      - name: Upload CLI Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCropper-CLI-${{ matrix.platform }}
          path: ./PhotoCropper-CLI-${{ matrix.platform }}.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-artifacts/**/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
