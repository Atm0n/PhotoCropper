name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  # Dry runs: build, package and smoke-test without publishing a release. A release PR into main runs them
  # automatically, so packaging problems show up before a tag is pushed.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the job that creates the GitHub release asks for write access.
permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # The same build and tests as CI, on Windows and Linux: a tag on a failing commit stops before anything is packaged.
    uses: ./.github/workflows/ci.yml

  build_package_publish:
    name: Build & Package (${{ matrix.platform }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
            platform: Linux
          - os: windows-latest
            runtime: win-x64
            platform: Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # Same packages and cache as ci.yml (see there).
      - name: Cache Native Packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-ubuntu-24.04-${{ hashFiles('.github/linux-packages.txt') }}

      - name: Install Native Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          grep -v '^#' .github/linux-packages.txt | xargs sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-cache"
          sudo rm -f ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache

      - name: Restore Dependencies
        run: dotnet restore PhotoCropper.slnx

      - name: Build Solution
        run: dotnet build PhotoCropper.slnx -c Release --no-restore

      - name: Generate Sample Scans
        if: runner.os == 'Linux'
        run: dotnet run --project tools/PhotoCropper.SampleScans -c Release --no-build -- ./publish/samples --count 6

      - name: Upload Sample Scans
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: PhotoCropper-SampleScans
          path: ./publish/samples

      - name: Publish GUI & CLI Binaries
        shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Publish GUI
          dotnet publish src/PhotoCropper.Gui/PhotoCropper.Gui.csproj `
            -c Release `
            -r $env:TARGET_RUNTIME `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o ./publish/gui/$env:TARGET_RUNTIME

          # Publish CLI
          dotnet publish src/PhotoCropper.Cli/PhotoCropper.Cli.csproj `
            -c Release `
            -r $env:TARGET_RUNTIME `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o ./publish/cli/$env:TARGET_RUNTIME

          # Remove any loose PDB symbols, Linux dbg symbols, or XML files from publish directories
          Get-ChildItem -Path ./publish -Include *.pdb,*.dbg,*.xml -Recurse -File | Remove-Item -Force

          # Extract version from tag (e.g. v2.5.2 -> 2.5.2)
          # Dry runs (no tag) use the version in Directory.Build.props.
          $rawTag = $env:REF_NAME
          $appVersion = if ($rawTag -and $rawTag.StartsWith('v')) { $rawTag.Substring(1) } else {
            ([regex]::Match((Get-Content Directory.Build.props -Raw), '<Version>([^<]+)</Version>')).Groups[1].Value
          }
          if (-not $appVersion) { exit 1 }
          Write-Host "Packaging version $appVersion"

          # Package separate zip archives (preserving Unix execution permissions on Linux)
          if ($env:TARGET_PLATFORM -eq 'Linux') {
            chmod +x ./publish/gui/$env:TARGET_RUNTIME/PhotoCropper.Gui
            chmod +x ./publish/cli/$env:TARGET_RUNTIME/PhotoCropper.Cli
            $repoRoot = (Get-Location).Path
            Push-Location "./publish/gui/$env:TARGET_RUNTIME"
            zip -q -r "$repoRoot/PhotoCropper-${appVersion}-GUI-${env:TARGET_PLATFORM}.zip" .
            Pop-Location
            Push-Location "./publish/cli/$env:TARGET_RUNTIME"
            zip -q -r "$repoRoot/PhotoCropper-${appVersion}-CLI-${env:TARGET_PLATFORM}.zip" .
            Pop-Location
          } else {
            Compress-Archive -Path ./publish/gui/$env:TARGET_RUNTIME/* -DestinationPath ./PhotoCropper-${appVersion}-GUI-${env:TARGET_PLATFORM}.zip
            Compress-Archive -Path ./publish/cli/$env:TARGET_RUNTIME/* -DestinationPath ./PhotoCropper-${appVersion}-CLI-${env:TARGET_PLATFORM}.zip
          }

          # Build Windows Inno Setup Installer
          if ($env:TARGET_PLATFORM -eq 'Windows') {
            $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) {
              "iscc"
            } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } else {
              choco install innosetup --no-progress
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }

            Write-Host "Compiling Windows installer with version $appVersion..."
            & $iscc "/DMyAppVersion=$appVersion" packaging/windows/PhotoCropper.iss
          }

          # Build Linux Packages (.deb and .AppImage)
          if ($env:TARGET_PLATFORM -eq 'Linux') {
            Write-Host "Building Linux .deb package with version $appVersion..."
            bash packaging/linux/build-deb.sh $appVersion

            Write-Host "Building Linux AppImage with version $appVersion..."
            bash packaging/linux/build-appimage.sh $appVersion
          }

      - name: Upload Windows Installer Artifact
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: PhotoCropper-Windows-Installer
          path: ./publish/installer/*.exe

      - name: Upload Linux Installer Artifacts (.deb and .AppImage)
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: PhotoCropper-Linux-Packages
          path: |
            ./publish/installer/*.deb
            ./publish/installer/*.AppImage

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhotoCropper-GUI-${{ matrix.platform }}
          path: ./*-GUI-${{ matrix.platform }}.zip

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhotoCropper-CLI-${{ matrix.platform }}
          path: ./*-CLI-${{ matrix.platform }}.zip

  # The packages as users get them, each on a clean system: catches what unit tests can't, such as a native
  # library left out of the published app (3.0.0's Linux packages had no OpenCV library) or a missing dependency.
  smoke_linux:
    name: Smoke Test (Linux packages)
    needs: build_package_publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          name: PhotoCropper-Linux-Packages
          path: ./smoke/packages

      - name: Download Sample Scans
        uses: actions/download-artifact@v8
        with:
          name: PhotoCropper-SampleScans
          path: ./smoke/samples

      - name: Run Smoke Tests
        run: bash packaging/smoke/linux-smoke.sh ./smoke/packages ./smoke/samples

  smoke_windows:
    name: Smoke Test (Windows installer)
    needs: build_package_publish
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Installer
        uses: actions/download-artifact@v8
        with:
          name: PhotoCropper-Windows-Installer
          path: ./smoke/installer

      - name: Download Sample Scans
        uses: actions/download-artifact@v8
        with:
          name: PhotoCropper-SampleScans
          path: ./smoke/samples

      - name: Run Smoke Tests
        shell: pwsh
        run: |
          $installer = Get-ChildItem ./smoke/installer -Filter *.exe | Select-Object -First 1
          ./packaging/smoke/windows-smoke.ps1 -Installer $installer.FullName -Samples (Resolve-Path ./smoke/samples).Path

  release:
    name: Create GitHub Release
    # Only for a pushed tag, and only once the packages passed their smoke tests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_package_publish, smoke_linux, smoke_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(release-artifacts/**/*.{zip,exe,deb,AppImage})
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
